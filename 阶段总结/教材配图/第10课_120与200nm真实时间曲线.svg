<title id="title">Book1 120 与 200 nm 旧实验时间曲线对照</title><desc id="desc">真实旧表重绘，120 nm 曲线在 60 分钟为 9.42、120 分钟为 16.87；200 nm 曲线在 60 分钟为 2.93、120 分钟为 15.45 微西门子每厘米。曲线差异不能单独证明机制。</desc>
