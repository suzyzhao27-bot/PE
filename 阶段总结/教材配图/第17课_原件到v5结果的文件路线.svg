<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" role="img" aria-label="PE项目从旧Origin原件到整理数据、导师v5程序和结果图的文件追溯概念路线">
  <rect width="1240" height="650" rx="26" fill="#f7fafc"/>
  <text x="52" y="59" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="31" font-weight="700" fill="#163448">一张结果图，要沿着四站找回它的来路</text>
  <text x="52" y="95" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#607687">项目现有文件的用途示意；箭头表示输入与来源，不代表新增独立实验</text>
  <rect x="52" y="136" width="262" height="280" rx="20" fill="#e6f3f5" stroke="#b8dbe0" stroke-width="2"/>
  <rect x="343" y="136" width="262" height="280" rx="20" fill="#edf2fb" stroke="#d1ddec" stroke-width="2"/>
  <rect x="634" y="136" width="262" height="280" rx="20" fill="#fff1e8" stroke="#f0d4bf" stroke-width="2"/>
  <rect x="925" y="136" width="262" height="280" rx="20" fill="#edf6ed" stroke="#cce2cc" stroke-width="2"/>
  <text x="183" y="185" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#16717b">① 旧实验原件</text>
  <text x="183" y="234" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#2c6069">Polymer_salt_2h.opju</text>
  <text x="183" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#4b6b72">Origin 时间与电导</text>
  <text x="183" y="315" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#4b6b72">原件只读保存</text>
  <text x="474" y="185" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#43639b">② 整理表副本</text>
  <text x="474" y="234" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#425d85">Book1__Sheet1.csv</text>
  <text x="474" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#526985">取六个旧 0/120 min 端点</text>
  <text x="474" y="315" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#526985">不是第二批实验</text>
  <text x="765" y="185" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#ad642f">③ 导师 v5 模型</text>
  <text x="765" y="234" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#976543">02_程序 / core、fit、pnp</text>
  <text x="765" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#806448">共享参数解释旧端点</text>
  <text x="765" y="315" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#806448">输出含残差与留一</text>
  <text x="1056" y="185" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="24" font-weight="700" fill="#44784c">④ 结果与边界</text>
  <text x="1056" y="234" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" fill="#4b7650">04_结果图 / 图1–4</text>
  <text x="1056" y="274" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#59775d">图1 是同六点训练比较</text>
  <text x="1056" y="315" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#59775d">图4 保留失败结果</text>
  <path d="M319 275h18m-8-8 8 8-8 8M610 275h18m-8-8 8 8-8 8M901 275h18m-8-8 8 8-8 8" fill="none" stroke="#748a99" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="52" y="474" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="22" font-weight="700" fill="#263f50">导师资料版本怎么排？</text>
  <rect x="52" y="495" width="1135" height="96" rx="18" fill="#ffffff" stroke="#dce7ee" stroke-width="2"/>
  <text x="142" y="548" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#436c79">v2 研究问题</text>
  <text x="406" y="548" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#436c79">v3 电荷实算</text>
  <text x="668" y="548" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" fill="#436c79">v4 降阶过渡</text>
  <text x="990" y="548" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700" fill="#b26936">v5 当前主模型入口</text>
  <path d="M252 542h26m-10-9 10 9-10 9M512 542h26m-10-9 10 9-10 9M792 542h35m-11-9 11 9-11 9" fill="none" stroke="#9aabb7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="620" y="628" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#657b8b">v5 是当前任务入口；旧版本仍保留，用来解释研究问题与核对模型来路</text>
</svg>
