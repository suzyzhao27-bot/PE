<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520" role="img" aria-label="导师v2假设长管30到1毫摩尔条件下中性负电正电共同盐通量比分别为1、1.056、0.928">
  <rect width="1120" height="520" rx="25" fill="#f7fafc"/>
  <text x="56" y="58" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#173449">同一条虚拟通道，只改表面电荷</text>
  <text x="56" y="94" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#64798a">导师 v2 已有计算 · 两端虚拟盐浓度 30→1 mM · 共同盐通量 ÷ 中性通量</text>
  <rect x="72" y="128" width="980" height="277" rx="17" fill="#fff" stroke="#dce7ee" stroke-width="2"/>
  <line x1="127" y1="361" x2="1017" y2="361" stroke="#8296a4" stroke-width="2"/>
  <line x1="127" y1="178" x2="1017" y2="178" stroke="#9ba9b1" stroke-width="2" stroke-dasharray="9 7"/>
  <text x="128" y="164" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" fill="#607382">中性参考 = 1</text>
  <rect x="224" y="178" width="150" height="183" rx="10" fill="#929fa9"/>
  <rect x="484" y="168" width="150" height="193" rx="10" fill="#287d9a"/>
  <rect x="744" y="192" width="150" height="169" rx="10" fill="#c09136"/>
  <text x="299" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#445461">1.000</text>
  <text x="559" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#156888">1.056</text>
  <text x="819" y="173" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#9d7020">0.928</text>
  <text x="299" y="391" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#344c5d">中性 σ=0</text>
  <text x="559" y="391" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#344c5d">负电 σ=−0.01</text>
  <text x="819" y="391" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#344c5d">正电 σ=+0.01</text>
  <text x="560" y="440" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" fill="#51697b">σ 单位 C/m²；柱高从零起算，纵向刻度只用于比较这三个模型比值</text>
  <text x="560" y="475" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#23475b">负电情景比中性稍高；这是反例，不是“真实 PE 负电有助透盐”的实验结论</text>
</svg>
