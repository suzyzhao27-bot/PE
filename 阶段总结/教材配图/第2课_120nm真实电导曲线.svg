<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
<title id="title">120 nm 旧实验电导随时间变化</title><desc id="desc">真实数据重绘：0 到 120 分钟七点，接收侧电导从 2.38 升到 16.87 微西门子每厘米。</desc>
<style>.tick{fill:#64788a;font:20px Arial,sans-serif}.label{fill:#244967;font:23px 'Microsoft YaHei',sans-serif}</style>
<rect width="1080" height="560" fill="#f4f8fc"/><rect x="34" y="28" width="1012" height="504" rx="26" fill="#fff" stroke="#dce7f0"/>
<text x="64" y="81" fill="#173956" font-size="34" font-family="Microsoft YaHei,sans-serif" font-weight="700">120 nm 标签：接收侧电导怎样变化？</text>
<text x="65" y="117" fill="#64788a" font-size="19" font-family="Microsoft YaHei,sans-serif">真实旧数据重绘 · Book1 C 列时间 / D 列电导</text>
<g><line x1="103" x2="902" y1="430" y2="430" stroke="#e4ecf2"/><text x="83" y="437" text-anchor="end" class="tick">0</text></g><g><line x1="103" x2="902" y1="362.5" y2="362.5" stroke="#e4ecf2"/><text x="83" y="369.5" text-anchor="end" class="tick">5</text></g><g><line x1="103" x2="902" y1="295" y2="295" stroke="#e4ecf2"/><text x="83" y="302" text-anchor="end" class="tick">10</text></g><g><line x1="103" x2="902" y1="227.5" y2="227.5" stroke="#e4ecf2"/><text x="83" y="234.5" text-anchor="end" class="tick">15</text></g><g><line x1="103" x2="902" y1="160" y2="160" stroke="#e4ecf2"/><text x="83" y="167" text-anchor="end" class="tick">20</text></g><line x1="103" x2="902" y1="430" y2="430" stroke="#7390a7" stroke-width="2"/><line x1="103" x2="103" y1="160" y2="430" stroke="#7390a7" stroke-width="2"/>
<path d="M110.0,397.9 L241.0,367.4 L372.0,335.8 L503.0,302.8 L634.0,272.7 L765.0,239.1 L896.0,202.3" fill="none" stroke="#287da6" stroke-width="4" stroke-linejoin="round"/><circle cx="110.0" cy="397.9" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="241.0" cy="367.4" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="372.0" cy="335.8" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="503.0" cy="302.8" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="634.0" cy="272.7" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="765.0" cy="239.1" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><circle cx="896.0" cy="202.3" r="8" fill="#e67f43" stroke="#fff" stroke-width="3"/><text x="110" y="466" text-anchor="middle" class="tick">0</text><text x="241" y="466" text-anchor="middle" class="tick">20</text><text x="372" y="466" text-anchor="middle" class="tick">40</text><text x="503" y="466" text-anchor="middle" class="tick">60</text><text x="634" y="466" text-anchor="middle" class="tick">80</text><text x="765" y="466" text-anchor="middle" class="tick">100</text><text x="896" y="466" text-anchor="middle" class="tick">120</text>
<text x="500" y="500" text-anchor="middle" class="label">时间 / min</text><text x="32" y="306" transform="rotate(-90 32 306)" text-anchor="middle" class="label">电导 / μS·cm⁻¹</text>
<rect x="745" y="320" width="255" height="92" rx="15" fill="#fff4e9" stroke="#f1c79f"/><text x="765" y="356" fill="#9b5d2a" font-size="20" font-family="Microsoft YaHei,sans-serif">120 min 增量</text><text x="765" y="390" fill="#9b5d2a" font-size="24" font-weight="700" font-family="Arial,sans-serif">16.87 − 2.38 = 14.49</text>
<text x="60" y="523" fill="#607589" font-size="17" font-family="Microsoft YaHei,sans-serif">连线仅作视觉引导；七点以外没有新增测量。</text></svg>
